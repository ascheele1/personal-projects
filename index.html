<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayou Macabre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --swamp:#0b0f0b; --swamp-2:#141a13; --moss:#7d8756; --bone:#e9dcbc; --bone-dim:#b8ab8a;
    --ember:#f0a84c; --wood:#6b4f2e; --wood-hi:#9a7646; --ink:#1a120a;
    --serif:"IM Fell English", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --swamp:#0b0f0b; --bone:#e9dcbc; } }
  :root[data-theme="dark"]{ --swamp:#0b0f0b; --bone:#e9dcbc; }
  html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--swamp)}
  *,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100%;color:var(--bone);font-family:var(--serif);
    background:radial-gradient(120% 60% at 50% 0%, #1a2217 0%, var(--swamp) 60%) var(--swamp);
    -webkit-font-smoothing:antialiased;
  }
  main{max-width:520px;margin:0 auto}

  /* ---------- the invitation art ---------- */
  .art{
    position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;isolation:isolate;
    cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;
    background:#080a07;
  }
  .art:focus-visible{outline:2px solid var(--ember);outline-offset:-4px}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    transition:filter 1.2s ease}
  .fx{position:absolute;inset:0;pointer-events:none}

  .moon{z-index:2;mix-blend-mode:screen;
    background:radial-gradient(circle at 45% 8%,rgba(255,236,185,.18) 0 10%,rgba(255,220,150,.07) 20%,transparent 34%);
    animation:breathe 7s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.55}}

  .candle{z-index:3;position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none;
    background:radial-gradient(closest-side,rgba(255,170,70,.55),rgba(255,120,30,.16) 45%,transparent);
    animation:flicker 2.3s infinite}
  .c1{left:-6%;top:47%;width:24%;height:18%}
  .c2{left:4%;top:54%;width:18%;height:14%;animation-delay:-.7s;animation-duration:1.9s}
  .c3{left:88%;top:65%;width:22%;height:16%;animation-delay:-1.3s}
  @keyframes flicker{
    0%,100%{opacity:.75;transform:scale(1)} 18%{opacity:.95;transform:scale(1.04)}
    34%{opacity:.7} 52%{opacity:1;transform:scale(1.06)} 71%{opacity:.8;transform:scale(.98)}
  }

  .fog{z-index:4;overflow:hidden}
  .fog i{position:absolute;left:-60%;width:220%;filter:blur(14px);will-change:transform}
  .fog .low{top:80%;height:18%;opacity:.5;
    background:radial-gradient(ellipse at 25% 50%,rgba(200,215,200,.22),transparent 40%),
               radial-gradient(ellipse at 70% 55%,rgba(190,205,192,.18),transparent 38%);
    animation:drift 26s linear infinite alternate}
  .fog .water{top:52%;height:9%;left:40%;width:120%;opacity:.35;
    background:radial-gradient(ellipse at 60% 50%,rgba(190,210,195,.25),transparent 55%);
    animation:drift 34s linear infinite alternate-reverse}
  @keyframes drift{to{transform:translateX(18%)}}

  .flies{z-index:5}
  .fly{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffd978;
    box-shadow:0 0 6px 2px rgba(255,200,80,.7);opacity:0}

  /* the drop */
  .drop{position:absolute;z-index:6;left:37%;top:-42%;width:14%;height:42%;pointer-events:none;
    transform:translateY(0);will-change:transform}
  .drop .silk{position:absolute;left:50%;top:0;bottom:22%;width:1px;
    background:linear-gradient(rgba(230,230,215,.15),rgba(230,230,215,.7))}
  .drop svg{position:absolute;left:0;bottom:0;width:100%;overflow:visible;
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.8))}
  .drop .leg{fill:none;stroke:#040404;stroke-width:5;stroke-linecap:round}

  /* the one big moment */
  .art.awake img{filter:brightness(1.12) saturate(1.1)}
  .art.awake .candle{animation:flare 3.6s ease-out both}
  @keyframes flare{0%{opacity:.8}10%{opacity:1;transform:scale(1.6)}40%{transform:scale(1.2)}100%{opacity:.8;transform:scale(1)}}
  .art.awake .moon{animation:moonflare 3.6s ease-out both}
  @keyframes moonflare{12%{opacity:1.8;filter:blur(2px)}100%{opacity:1}}
  .art.awake .drop{animation:drop 3.8s cubic-bezier(.3,.8,.3,1) both}
  @keyframes drop{
    0%{transform:translateY(0)} 16%{transform:translateY(50%)} 23%{transform:translateY(38%)}
    30%{transform:translateY(44%)} 66%{transform:translateY(44%)} 100%{transform:translateY(0)}
  }

  .hint{margin:.9rem 0 0;text-align:center;font-style:italic;font-size:.95rem;color:var(--bone-dim);
    transition:opacity .6s ease}
  .hint.gone{opacity:0}

  /* ---------- details ---------- */
  .details{padding:2.2rem 1.5rem 1rem;text-align:center}
  .when{font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.15;margin:0;font-weight:400;letter-spacing:.01em}
  .where{margin:.6rem 0 0;font-size:1.15rem;line-height:1.5;color:var(--bone-dim)}
  .where strong{color:var(--bone);font-weight:400}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem;margin-top:1.4rem}
  [hidden]{display:none!important}
  .btn{display:inline-flex;align-items:center;gap:.45rem;min-height:46px;padding:.65rem 1.15rem;
    font:inherit;font-size:1.05rem;color:var(--bone);text-decoration:none;cursor:pointer;
    background:rgba(233,220,188,.06);border:1px solid rgba(233,220,188,.28);border-radius:6px}
  .btn:active{background:rgba(233,220,188,.14)}
  .btn:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
  .btn svg{width:18px;height:18px;flex:none}

  .fine{margin:1.6rem auto 0;max-width:30ch;font-style:italic;line-height:1.55;color:var(--bone-dim);font-size:1.02rem}

  /* ---------- ouija rsvp ---------- */
  .rsvp{padding:2rem 1rem 3rem;text-align:center}
  .rsvp h2{font-weight:400;font-size:1.6rem;margin:0 0 1rem}
  .board{
    position:relative;margin:0 auto;max-width:440px;aspect-ratio:16/9;border-radius:18px;
    color:var(--ink);
    background:
      radial-gradient(120% 90% at 50% 40%,rgba(255,230,180,.35),transparent 70%),
      repeating-linear-gradient(92deg,rgba(60,35,15,.10) 0 2px,transparent 2px 9px),
      linear-gradient(180deg,#b8915a,#8d6a3b 70%,#6f5230);
    box-shadow:inset 0 0 0 2px rgba(40,25,10,.5),inset 0 0 40px rgba(40,20,5,.55),0 18px 40px rgba(0,0,0,.6);
  }
  .answer{
    position:absolute;top:10%;padding:.4rem .9rem;border:0;background:none;cursor:pointer;
    font:inherit;font-size:clamp(1.9rem,9vw,2.6rem);letter-spacing:.06em;color:var(--ink);
    text-decoration:none;border-radius:8px;opacity:.88;
  }
  .answer:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .answer.yes{left:8%} .answer.no{right:8%}
  .answer.chosen{opacity:1;text-shadow:0 0 14px rgba(255,210,120,.9)}
  .sun{position:absolute;left:50%;top:14%;width:13%;transform:translateX(-50%);opacity:.55}
  .board .bye{position:absolute;left:0;right:0;bottom:9%;font-size:1.05rem;letter-spacing:.3em;opacity:.55}
  .planchette{position:absolute;left:50%;top:58%;width:19%;transform:translate(-50%,-50%);
    transition:left .9s cubic-bezier(.45,.05,.3,1),top .9s cubic-bezier(.45,.05,.3,1);
    filter:drop-shadow(0 6px 6px rgba(0,0,0,.45));pointer-events:none}
  .rsvp .note{margin:1rem 0 0;font-style:italic;color:var(--bone-dim);font-size:1rem}
  .rsvp .said{margin:.4rem 0 0;color:var(--ember);font-size:1.1rem;min-height:1.4em}

  @media (prefers-reduced-motion: reduce){
    .moon,.candle,.fog i{animation:none!important}
    .art.awake .drop{animation:none}
    .planchette{transition:none}
  }
</style>
</head>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
        Get directions</a>
    </div>
    <p class="fine">Come dressed as whatever crawled out of the swamp. Costumes are strongly encouraged.</p>
  </section>

  <section class="rsvp" aria-labelledby="rsvp-q">
    <h2 id="rsvp-q">Will you come?</h2>
    <div class="board" id="board">
      <a class="answer yes" id="yes">YES</a>
      <svg class="sun" viewBox="0 0 40 40" fill="none" stroke="#1a120a" stroke-width="1.4" aria-hidden="true"><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M8.7 31.3l4.2-4.2M27.1 12.9l4.2-4.2"/><circle cx="20" cy="20" r="6.5"/></svg>
      <a class="answer no" id="no">NO</a>
      <svg class="planchette" id="planchette" viewBox="0 0 100 110" aria-hidden="true">
        <path d="M50 4C24 4 8 30 8 56c0 22 14 40 24 50h36c10-10 24-28 24-50C92 30 76 4 50 4z" fill="#e9dcbc" stroke="#3a2812" stroke-width="3"/>
        <circle cx="50" cy="48" r="15" fill="rgba(40,25,10,.25)" stroke="#3a2812" stroke-width="3"/>
        <circle cx="50" cy="48" r="10" fill="rgba(255,240,210,.35)"/>
      </svg>
      <div class="bye" aria-hidden="true">GOOD BYE</div>
    </div>
    <p class="note" id="note"></p>
    <p class="said" id="said" aria-live="polite"></p>
  </section>
</main>

<script>
/* ---- Party details: edit these ---- */
const PARTY = {
  host: "Alec",
  phone: "+13034084876",
  address: "5225 E 116th Pl, Thornton, CO 80233",
  start: "20261030T193000",
  end:   "20261031T000000"
};

(() => {
  const $ = id => document.getElementById(id);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Where
  $('where').innerHTML = PARTY.address
    ? `At ${PARTY.host}'s place<br><strong></strong>`
    : `At ${PARTY.host}'s place. Text ${PARTY.host} for the address.`;
  if (PARTY.address) $('where').querySelector('strong').textContent = PARTY.address;

  // Calendar + map
  const cal = new URL('https://calendar.google.com/calendar/render');
  cal.searchParams.set('action','TEMPLATE');
  cal.searchParams.set('text','Bayou Macabre');
  cal.searchParams.set('dates',`${PARTY.start}/${PARTY.end}`);
  cal.searchParams.set('details','A Halloween party. Costumes encouraged.');
  if (PARTY.address) cal.searchParams.set('location',PARTY.address);
  $('cal').href = cal.toString();
  if (PARTY.address){
    $('map').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(PARTY.address);
    $('map').hidden = false;
  }

  // RSVP by text
  const sms = body => `sms:${PARTY.phone}${/iP(hone|ad|od)/.test(navigator.userAgent) ? '&' : '?'}body=${encodeURIComponent(body)}`;
  $('yes').href = sms(`YES. The spirits say I'm coming to Bayou Macabre on the 30th.`);
  $('no').href  = sms(`NO. The spirits say I can't make Bayou Macabre this year.`);
  $('note').textContent = `Tapping an answer opens a text to ${PARTY.host}.`;

  const board = $('board'), plan = $('planchette');
  function moveTo(el, label){
    const b = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    plan.style.left = ((r.left + r.width/2 - b.left) / b.width * 100) + '%';
    const p = plan.getBoundingClientRect();
    plan.style.top  = ((r.bottom + p.height*0.42 - b.top) / b.height * 100) + '%';
    document.querySelectorAll('.answer').forEach(a => a.classList.toggle('chosen', a === el));
    $('said').textContent = label;
  }
  const pick = (el, key, label) => el.addEventListener('click', () => {
    moveTo(el, label);
    try { localStorage.setItem('bayou-rsvp', key); } catch(e){}
  });
  pick($('yes'), 'yes', 'See you in the moss.');
  pick($('no'),  'no',  'The bayou will miss you.');
  try {
    const prev = localStorage.getItem('bayou-rsvp');
    if (prev) requestAnimationFrame(() => prev === 'yes'
      ? moveTo($('yes'), 'See you in the moss.') : moveTo($('no'), 'The bayou will miss you.'));
  } catch(e){}

  // Fireflies, kept to the edges so the lettering stays clean
  const flies = $('flies');
  const spot = () => {
    const r = Math.random();
    if (r < .25) return [8 + Math.random()*84, 2 + Math.random()*14];
    return [r < .62 ? 2 + Math.random()*16 : 84 + Math.random()*14, 18 + Math.random()*58];
  };
  const bugs = [];
  if (!reduce) for (let i = 0; i < 14; i++){
    const b = document.createElement('b'); b.className = 'fly';
    const [x,y] = spot(); b.style.left = x+'%'; b.style.top = y+'%';
    flies.appendChild(b); bugs.push(b);
    const dx = (Math.random()-.5)*30, dy = (Math.random()-.5)*22;
    b.animate([
      {transform:'translate(0,0)', opacity:0},
      {transform:`translate(${dx*.5}px,${dy*.5}px)`, opacity:.95, offset:.5},
      {transform:`translate(${dx}px,${dy}px)`, opacity:0}
    ], {duration:3200+Math.random()*3800, iterations:Infinity, delay:-Math.random()*6000, easing:'ease-in-out'});
  }

  // Wake the bayou
  const art = $('art'); let busy = false;
  function wake(){
    if (busy) return; busy = true;
    $('hint').classList.add('gone');
    art.classList.remove('awake'); void art.offsetWidth; art.classList.add('awake');
    if (navigator.vibrate) { try { navigator.vibrate([18, 60, 30]); } catch(e){} }
    bugs.forEach((b,i) => b.animate([
      {transform:'translate(0,0) scale(1)', opacity:1},
      {transform:`translate(${(Math.random()-.5)*60}px,${-20-Math.random()*40}px) scale(1.6)`, opacity:1},
      {transform:'translate(0,0) scale(1)', opacity:.4}
    ], {duration:900+Math.random()*500, delay:i*20, easing:'ease-out', composite:'add'}));
    setTimeout(() => { art.classList.remove('awake'); busy = false; }, 3900);
  }
  art.addEventListener('click', wake);
  art.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); wake(); } });
})();
</script>
</body>
</html>
